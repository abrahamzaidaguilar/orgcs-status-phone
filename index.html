<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src ws: wss:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>OrgCS Status</title>
<style>
  :root { --bg:#f3f3f3; --fg:#181818; --card:#fff; --accent:#0176d3; --muted:#5c5c5c; --ok:#2e844a; --bad:#ba0517; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --fg:#f3f3f3; --card:#22252b; --muted:#a8acb3; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); background:var(--bg); color:var(--fg); font:17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:520px; margin:0 auto; padding:20px 0 40px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  .now { background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:14px; }
  .now b { display:block; font-size:20px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--bad); margin-right:6px; }
  .dot.on { background:var(--ok); }
  .grid { display:grid; gap:10px; }
  button { font:inherit; text-align:left; padding:14px 16px; border:0; border-radius:12px; background:var(--card); color:var(--fg); }
  button[aria-current="true"] { outline:3px solid var(--accent); }
  button:disabled { opacity:.5; }
  .msg { min-height:24px; margin-top:14px; color:var(--muted); }
  .msg.error { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>OrgCS Status</h1>
  <p class="sub" id="who"></p>
  <div class="now"><span class="dot" id="dot"></span><span id="conn">Connecting…</span><b id="current">—</b></div>
  <div class="grid" id="list" role="group" aria-label="Statuses"></div>
  <div class="msg" id="msg" role="status"></div>
</main>
<script src="protocol.js"></script>
<script src="relay-client.js"></script>
<script src="session.js"></script>
<script src="app.js"></script>
</body>
</html>
